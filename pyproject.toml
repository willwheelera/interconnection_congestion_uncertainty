[project]
name = "amps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gridstatus>=0.34.0",
    "gridstatusio>=0.5.6",
    "gridx-egret",
    "gurobipy>=13.0.1",
    "highspy>=1.13.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandapower>=3.1.2",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pytz>=2026.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tzdata>=2025.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ is the import root: every module/package under it (utils, grid_data,
# tail_sampling, the loose top-level scripts) is importable by name once the
# project is installed editable, with no sys.path manipulation.
only-include = ["src"]
sources = ["src"]

[tool.uv]
override-dependencies = ["lxml>=6.0"]

[tool.uv.sources]
gridx-egret = { git = "https://github.com/grid-parity-exchange/Egret.git" }

[dependency-groups]
docs = [
    "furo>=2024.8",
    "sphinx>=8.0",
    "sphinx-copybutton>=0.5",
]

