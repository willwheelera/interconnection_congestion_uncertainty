[project]
name = "amps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gridstatus>=0.34.0",
    "gridstatusio>=0.5.6",
    "gridx-egret",
    "gurobipy>=13.0.1",
    "highspy>=1.13.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandapower>=3.1.2",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "pytz>=2026.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tzdata>=2025.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The repository root is the import root, so `src` itself is the package and every
# first-party import is `src.<stage>....`.  Fully qualifying them is what keeps a stage
# package from being shadowed by a same-named sibling module when a file is run as a
# script (see src/__init__.py).
only-include = ["src"]

[tool.uv]
override-dependencies = ["lxml>=6.0"]

[tool.uv.sources]
gridx-egret = { git = "https://github.com/grid-parity-exchange/Egret.git" }

[dependency-groups]
docs = [
    "furo>=2024.8",
    "sphinx>=8.0",
    "sphinx-copybutton>=0.5",
]

